[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hey-whisper"
version = "0.1.0"
description = "Microphone voice notes transcribed with faster-whisper into weekly markdown logs."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "faster-whisper>=1.0.0",
    "sounddevice>=0.5.0",
    "numpy>=1.24.0",
    "PyQt6>=6.6.0",
    "dbus-next>=0.2.3",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
]
nemo = [
    "onnx-asr[cpu,hub]>=0.11.0",
]

[project.scripts]
hey-whisper = "hey_whisper.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
