name: Build and Publish Flatpak

'on':
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libportaudio2 \
            portaudio19-dev \
            libasound2-dev \
            libpulse-dev \
            libgl1 \
            libegl1 \
            libxkbcommon0 \
            libdbus-1-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest pytest-timeout

      - name: Run Pytest
        env:
          QT_QPA_PLATFORM: offscreen
          CI: "true"
          HEY_WHISPER_NO_PORTAL: "true"
        run: |
          pytest -v --timeout=30 --durations=10

  joplin-plugin:
    name: Test & Build Joplin Plugin
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: joplin-plugin
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: joplin-plugin/package-lock.json

      - name: Sync plugin version with release tag
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        run: |
          # Same reasoning as the app's version sync below: releases are just tags.
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          npm pkg set version="${TAG_VERSION}"
          sed -i "s/\"version\": \".*\"/\"version\": \"${TAG_VERSION}\"/" src/manifest.json

      - name: Install dependencies
        # --ignore-scripts skips the "prepare" build; it runs explicitly below
        run: npm ci --ignore-scripts

      - name: Run Jest
        run: npm test

      - name: Build plugin archive (.jpl)
        run: npm run dist

      - name: Upload plugin as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: hey-whisper-joplin-plugin
          path: joplin-plugin/publish/org.heywhisper.joplin.jpl
          if-no-files-found: error
          retention-days: 30

  build-and-publish:
    name: Build & Publish Flatpak
    needs: [test, joplin-plugin]
    runs-on: ubuntu-latest
    # Successful runs have taken 10-15 minutes; this is a backstop against any
    # step hanging indefinitely (GitHub's own default is 360 minutes) rather
    # than failing fast, which has happened before with release-asset uploads.
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify tag is reachable from main
        run: |
          # The push.tags filter above only matches the tag NAME (vX.Y.Z); it says
          # nothing about which branch the tagged commit is actually on. Without
          # this check, tagging a commit on any branch - not just main - would
          # still trigger a full build and a published release.
          git fetch origin main --quiet
          if ! git merge-base --is-ancestor "${{ github.sha }}" origin/main; then
            echo "::error::Tag '${{ github.ref_name }}' (commit ${{ github.sha }}) is not on main; refusing to build/publish a release."
            exit 1
          fi

      - name: Sync app version with release tag
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        run: |
          # The committed __version__/pyproject.toml version isn't bumped per release
          # (releases are just `git tag vX.Y.Z && git push`), so without this the
          # version shown in the app's settings dialog silently drifts from the tag
          # actually being built and released. Stamp both from the tag name instead.
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          sed -i "s/^version = \".*\"/version = \"${TAG_VERSION}\"/" pyproject.toml
          sed -i "s/^__version__ = \".*\"/__version__ = \"${TAG_VERSION}\"/" src/hey_whisper/__init__.py

      - name: Maximize Runner Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/share/swift 2>/dev/null || true

      - name: Install Flatpak & Flatpak Builder
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder

      - name: Add Flathub Remote
        run: |
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo

      - name: Cache Flatpak Builder State
        uses: actions/cache@v4
        with:
          path: |
            .flatpak-builder
          key: flatpak-builder-${{ runner.os }}-${{ hashFiles('org.heywhisper.HeyWhisper.yaml') }}
          restore-keys: |
            flatpak-builder-${{ runner.os }}-

      - name: Install KDE 6.11 Platform and SDK
        run: |
          flatpak install --user -y --noninteractive flathub org.kde.Platform//6.11 org.kde.Sdk//6.11

      - name: Import GPG Signing Key
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        run: |
          mkdir -m 700 -p "${RUNNER_TEMP}/gpg-homedir"
          echo "${FLATPAK_GPG_PRIVATE_KEY}" | gpg --homedir "${RUNNER_TEMP}/gpg-homedir" --batch --import
          FPR=$(gpg --homedir "${RUNNER_TEMP}/gpg-homedir" --list-secret-keys --with-colons | awk -F: '/^fpr:/ {print $10; exit}')
          if [ -z "${FPR}" ]; then
            echo "::error::Could not determine fingerprint of imported GPG key"
            exit 1
          fi
          echo "GPG_HOMEDIR=${RUNNER_TEMP}/gpg-homedir" >> "$GITHUB_ENV"
          echo "GPG_KEY_FPR=${FPR}" >> "$GITHUB_ENV"
        env:
          FLATPAK_GPG_PRIVATE_KEY: ${{ secrets.FLATPAK_GPG_PRIVATE_KEY }}

      - name: Restore Published Flatpak Repo (for incremental updates)
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        run: |
          # `flatpak update` needs prior releases' commit history present in the
          # repo, not just the latest one, so clients can update incrementally.
          # Seed repo/ from the gh-pages branch (which we publish it to) before
          # flatpak-builder adds this release's commit on top of that history.
          if git ls-remote --exit-code --heads origin gh-pages > /dev/null 2>&1; then
            git fetch origin gh-pages --quiet
            git worktree add --detach /tmp/gh-pages-seed origin/gh-pages
            mkdir -p repo
            if [ -d /tmp/gh-pages-seed/repo ]; then
              cp -a /tmp/gh-pages-seed/repo/. repo/
            fi
            git worktree remove /tmp/gh-pages-seed --force
          else
            echo "No gh-pages branch found; starting a fresh repo."
            mkdir -p repo
          fi

      - name: Build Flatpak Application
        run: |
          SIGN_ARGS=()
          if [ -n "${GPG_KEY_FPR:-}" ]; then
            SIGN_ARGS=(--gpg-sign="${GPG_KEY_FPR}" --gpg-homedir="${GPG_HOMEDIR}")
          fi
          flatpak-builder --user --disable-rofiles-fuse --force-clean --repo=repo "${SIGN_ARGS[@]}" build-dir org.heywhisper.HeyWhisper.yaml

      - name: Create Standalone Flatpak Bundle (.flatpak)
        run: |
          SIGN_ARGS=()
          if [ -n "${GPG_KEY_FPR:-}" ]; then
            SIGN_ARGS=(--gpg-sign="${GPG_KEY_FPR}" --gpg-homedir="${GPG_HOMEDIR}")
          fi
          flatpak build-bundle --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo "${SIGN_ARGS[@]}" repo hey-whisper.flatpak org.heywhisper.HeyWhisper
          ls -lh hey-whisper.flatpak

      - name: Publish Flatpak Repo to GitHub Pages (gh-pages branch)
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        run: |
          # This is what makes installs auto-update: anyone who ran `flatpak
          # remote-add` against this repo (rather than installing the standalone
          # bundle above) picks up every new tagged release via `flatpak update`.
          flatpak build-update-repo --gpg-sign="${GPG_KEY_FPR}" --gpg-homedir="${GPG_HOMEDIR}" repo

          gpg --homedir "${GPG_HOMEDIR}" --batch --yes --export --armor "${GPG_KEY_FPR}" > repo/hey-whisper-repo-signing-key.asc
          GPG_KEY_B64=$(gpg --homedir "${GPG_HOMEDIR}" --export "${GPG_KEY_FPR}" | base64 -w0)

          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          cat > repo/hey-whisper.flatpakrepo <<EOF
          [Flatpak Repo]
          Title=Hey Whisper
          Url=https://${GITHUB_REPOSITORY_OWNER}.github.io/${REPO_NAME}/repo
          Comment=Hey Whisper voice notes app
          Description=Self-hosted Flatpak repository for Hey Whisper (auto-updating installs outside Flathub).
          Homepage=https://github.com/${GITHUB_REPOSITORY}
          Icon=https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/org.heywhisper.HeyWhisper.svg
          GPGKey=${GPG_KEY_B64}
          EOF

          # Regenerated on every publish so the landing page can never go stale
          # the way a one-off manually-created index.html did (it kept
          # recommending --no-gpg-verify long after the repo was GPG-signed,
          # since nothing was updating it).
          cat > repo/index.html <<EOF
          <!DOCTYPE html>
          <html>
          <head><title>Hey Whisper Flatpak Repo</title></head>
          <body>
          <h1>Hey Whisper Flatpak Repository</h1>
          <p>Self-hosted, GPG-signed Flatpak repository for
          <a href="https://github.com/${GITHUB_REPOSITORY}">Hey Whisper</a>. Add it once and
          <code>flatpak update</code> picks up every new release automatically.</p>
          <pre>flatpak remote-add --user --if-not-exists --from hey-whisper https://${GITHUB_REPOSITORY_OWNER}.github.io/${REPO_NAME}/hey-whisper.flatpakrepo
          flatpak install --user hey-whisper org.heywhisper.HeyWhisper</pre>
          <p><code>--from</code> reads the <a href="hey-whisper.flatpakrepo">.flatpakrepo file</a>, which embeds
          the repo's GPG public key, so signature verification is configured automatically - no
          <code>--no-gpg-verify</code> needed. The public key is also available directly at
          <a href="repo/hey-whisper-repo-signing-key.asc">repo/hey-whisper-repo-signing-key.asc</a>.</p>
          <p>Latest published version: <strong>${{ github.ref_name }}</strong></p>
          </body>
          </html>
          EOF

          PUBLISH_DIR="${RUNNER_TEMP}/gh-pages-publish"
          rm -rf "${PUBLISH_DIR}"
          if git ls-remote --exit-code --heads origin gh-pages > /dev/null 2>&1; then
            git clone --branch gh-pages --single-branch --depth=1 \
              "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "${PUBLISH_DIR}"
          else
            mkdir -p "${PUBLISH_DIR}"
            git -C "${PUBLISH_DIR}" init -q -b gh-pages
          fi

          rsync -a --delete --exclude='.lock' repo/ "${PUBLISH_DIR}/repo/"
          cp repo/hey-whisper.flatpakrepo "${PUBLISH_DIR}/hey-whisper.flatpakrepo"
          # Note: the site root (index.html, logo.svg, screenshots/) is a
          # hand-maintained landing page, not touched by this workflow. Only
          # repo/index.html (the Flatpak repo's own status page) is generated
          # here.

          cd "${PUBLISH_DIR}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No repo changes to publish."
          else
            git commit -q -m "Update Flatpak repo for ${{ github.ref_name }}"
            git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:gh-pages
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Flatpak as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: hey-whisper-flatpak
          path: hey-whisper.flatpak
          if-no-files-found: error
          retention-days: 30

      - name: Determine Release Information
        id: release_info
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG_NAME="${GITHUB_REF#refs/tags/}"
            echo "tag=${TAG_NAME}" >> "$GITHUB_OUTPUT"
            echo "title=Release ${TAG_NAME}" >> "$GITHUB_OUTPUT"
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
            echo "title=Hey Whisper (Latest Build)" >> "$GITHUB_OUTPUT"
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: ${{ steps.release_info.outputs.tag }}
          name: ${{ steps.release_info.outputs.title }}
          draft: false
          prerelease: ${{ steps.release_info.outputs.is_prerelease == 'true' }}
          make_latest: "true"
          generate_release_notes: true
          body: |
            ### Automated Flatpak Package

            Standalone Flatpak bundle built automatically from commit `${{ github.sha }}` for tag `${{ github.ref_name }}`.

            #### Download & Install:
            ```bash
            # Install or update the Flatpak bundle
            flatpak install --user -y --reinstall hey-whisper.flatpak

            # Launch Hey Whisper
            flatpak run org.heywhisper.HeyWhisper
            ```
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Flatpak Bundle to Release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        run: |
          # Uploading the ~140MB bundle via the release action's built-in (octokit)
          # asset upload has intermittently failed or hung. `gh release upload` goes
          # through a different code path and has been more reliable, but a single
          # attempt has itself been observed to hang indefinitely (no response, no
          # error) rather than failing fast - which defeats a plain retry loop,
          # since a hung attempt never returns to let the loop retry. Wrap each
          # attempt in `timeout` so a stall gets killed and actually retried.
          # --clobber makes a retry safe even if a partial asset from a previous
          # attempt is already there.
          for attempt in 1 2 3; do
            if timeout 180 gh release upload "${{ steps.release_info.outputs.tag }}" hey-whisper.flatpak --clobber; then
              echo "Upload succeeded on attempt ${attempt}"
              exit 0
            fi
            echo "Upload attempt ${attempt} failed or timed out, retrying in 15s..."
            sleep 15
          done
          echo "::error::Failed to upload hey-whisper.flatpak after 3 attempts"
          exit 1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Download Joplin Plugin Artifact
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        uses: actions/download-artifact@v4
        with:
          name: hey-whisper-joplin-plugin
          path: joplin-plugin-dist

      - name: Upload Joplin Plugin to Release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        run: |
          timeout 120 gh release upload "${{ steps.release_info.outputs.tag }}" joplin-plugin-dist/org.heywhisper.joplin.jpl --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Clean Up GPG Signing Key
        if: always()
        run: |
          rm -rf "${RUNNER_TEMP}/gpg-homedir"
