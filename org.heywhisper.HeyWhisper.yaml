app-id: org.heywhisper.HeyWhisper
runtime: org.kde.Platform
runtime-version: '6.11'
sdk: org.kde.Sdk
command: hey-whisper

finish-args:
  # Display servers
  - --socket=fallback-x11
  - --socket=wayland
  - --share=ipc
  # Microphone capture via PipeWire / PulseAudio
  - --socket=pulseaudio
  # Storage access for user notes and configuration.
  # --filesystem=host alone covers ~/.config/hey-whisper.conf; do NOT also grant
  # --filesystem=xdg-config/hey-whisper.conf:create for a single file path - Flatpak's
  # bind-mount setup creates a directory as the mount point when the target doesn't
  # exist yet, permanently turning ~/.config/hey-whisper.conf into an empty directory
  # that open(path, "w") can never write to (silently breaking settings persistence).
  - --filesystem=host
  # Network access for downloading faster-whisper, GGML, and Parakeet/Canary (onnx-asr) model weights
  - --share=network
  # GPU / Vulkan hardware acceleration (AMD, Intel, Nvidia)
  - --device=all

build-options:
  env:
    PYTHONPATH: /app/lib/python3.11/site-packages

# Stripped from /app once every module has built, since none of it is needed at
# runtime: glslc and vulkan-shaders-gen are Vulkan-shader build tools consumed
# only while compiling whisper.cpp; whisper-bench/whisper-server are unused
# whisper.cpp example binaries (only whisper-cli is actually invoked); the rest
# is C headers, static libs, CMake/pkg-config metadata, and docs left behind by
# portaudio's and whisper.cpp's "install" steps for other software to build
# against them, which nothing in this app does at runtime.
cleanup:
  - /bin/glslc
  - /bin/vulkan-shaders-gen
  - /bin/whisper-bench
  - /bin/whisper-server
  - /include
  - /lib/*.a
  - /lib/*.la
  - /lib/cmake
  - /lib/pkgconfig
  - /share/doc
  - /share/man

modules:
  - name: portaudio
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DPA_BUILD_SHARED=ON
      - -DPA_USE_ALSA=ON
      - -DPA_USE_PULSEAUDIO=ON
      # portaudio's own CMakeLists.txt declares `cmake_minimum_required(VERSION 2.8)`,
      # which CMake >= 4.0 (shipped in org.kde.Sdk//6.11+) refuses to configure at
      # all rather than just warning, since compatibility below 3.5 was removed.
      - -DCMAKE_POLICY_VERSION_MINIMUM=3.5
    sources:
      - type: archive
        url: https://github.com/PortAudio/portaudio/archive/refs/tags/v19.7.0.tar.gz
        sha256: 5af29ba58bbdbb7bbcefaaecc77ec8fc413f0db6f4c4e286c40c3e1b83174fa0

  - name: glslc
    buildsystem: simple
    build-options:
      build-args:
        - --share=network
    build-commands:
      - install -d /app/bin
      - curl -sL "https://sdk.lunarg.com/sdk/download/latest/linux/vulkan-sdk.tar.xz" | tar -xJ --wildcards "*/x86_64/bin/glslc" -O > /app/bin/glslc
      - chmod +x /app/bin/glslc

  - name: whisper-vulkan
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DGGML_VULKAN=ON
      - -DVulkan_GLSLC_EXECUTABLE=/app/bin/glslc
      - -DWHISPER_BUILD_EXAMPLES=ON
    sources:
      - type: archive
        url: https://github.com/ggml-org/whisper.cpp/archive/refs/tags/v1.7.4.tar.gz
        sha256: 9ce7b33028793fcbf62f81f1fd087af7778dace8772eaba8c43c66bf0c8a3eed

  - name: hey-whisper
    buildsystem: simple
    build-options:
      build-args:
        - --share=network
    build-commands:
      - python3 -m pip install --prefix=/app --no-warn-script-location faster-whisper sounddevice numpy PyQt6 dbus-next "onnx-asr[cpu,hub]" .
      - install -Dm644 org.heywhisper.HeyWhisper.desktop /app/share/applications/org.heywhisper.HeyWhisper.desktop
      - install -Dm644 org.heywhisper.HeyWhisper.metainfo.xml /app/share/metainfo/org.heywhisper.HeyWhisper.metainfo.xml
      - install -Dm644 org.heywhisper.HeyWhisper.svg /app/share/icons/hicolor/scalable/apps/org.heywhisper.HeyWhisper.svg
      - for s in 16 24 32 48 64 128 256 512; do install -Dm644 resources/icons/${s}x${s}/org.heywhisper.HeyWhisper.png /app/share/icons/hicolor/${s}x${s}/apps/org.heywhisper.HeyWhisper.png; done
    sources:
      - type: dir
        path: .
        skip:
          - .venv
          - .flatpak-builder
          - build-dir
          - repo
          - "*.flatpak"
          - .git
          - .pytest_cache
          - "*.egg-info"
